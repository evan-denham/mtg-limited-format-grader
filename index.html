<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Limited Format Grader</title>
    <meta
      name="description"
      content="Grade every card in a Magic set for Limited, card by card, with one or more graders."
    />
    <meta name="theme-color" content="#0f1115" />

    <!-- One photo everywhere, at the size each context wants. All of these are
         derived from the same source image, padded square on the page
         background so nothing is stretched from its native 139x126. -->
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />

    <!-- Link preview when a session URL is pasted into a chat. og:image must
         be an absolute URL; most scrapers will not resolve a relative one. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Limited Format Grader" />
    <meta
      property="og:description"
      content="Grade every card in a Magic set for Limited, card by card, with one or more graders."
    />
    <meta
      property="og:image"
      content="https://evan-denham.github.io/mtg-limited-format-grader/preview.png"
    />
    <meta property="og:url" content="https://evan-denham.github.io/mtg-limited-format-grader/" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
